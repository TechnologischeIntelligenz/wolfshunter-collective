name: WOLFSHUNTER repair validation
# Last updated after the PostgreSQL fixture and runtime-import fixes.

on:
  push:
    branches:
      - fix/validate-live-worker-20261009
  workflow_dispatch:

permissions:
  contents: read

# Separate group from earlier stuck runs; keep one active run without cancelling it
# on every code update. This workflow can deploy only the repair branch to the test Worker.
concurrency:
  group: wolfshunter-repair-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair-validate-deploy:
    name: Build, test, deploy test Worker, verify HTTP and browser
    if: ${{ github.ref == 'refs/heads/fix/validate-live-worker-20261009' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CI: "true"
      SHOPIFY_API_KEY: "test-client-id"
      SHOPIFY_API_SECRET: "test-client-secret"
      SCOPES: "read_locations,read_orders,write_assigned_fulfillment_orders,write_fulfillments,write_inventory,write_products,read_markets,read_shipping,write_shipping,read_legal_policies"
      SHOPIFY_APP_URL: "https://wolfshunter-collective-test.limoorange99.workers.dev"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.WRANGLER_API_TOKEN }}
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Generate Cloudflare Worker bindings
        run: npx wrangler types --strict-vars false
      - name: Production build and TypeScript check
        run: npm run typecheck
      - name: Unit and database-adapter tests
        run: npm test
      - name: Lint (report only while recovering legacy files)
        continue-on-error: true
        run: npm run lint
      - name: Cloudflare dry-run
        run: npx wrangler deploy --dry-run
      - name: Require Cloudflare deploy credential
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Build, tests and Wrangler dry-run passed, but no Cloudflare deploy credential was available to this GitHub Actions job." >> "$GITHUB_STEP_SUMMARY"
            echo "Accepted secret names: CLOUDFLARE_API_TOKEN, CF_API_TOKEN, CLOUDFLARE_TOKEN, WRANGLER_API_TOKEN." >> "$GITHUB_STEP_SUMMARY"
            echo "A secret stored only in local .env.local or inside the deployed Worker is not available to GitHub Actions." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Deploy the configured test Worker
        run: npx wrangler deploy
      - name: HTTP smoke test for test Worker
        run: node scripts/smoke-workers.mjs https://wolfshunter-collective-test.limoorange99.workers.dev
      - name: HTTP smoke test for collective.wolfshunter.com
        run: node scripts/smoke-workers.mjs https://collective.wolfshunter.com
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        env:
          SMOKE_BASE_URL: "https://wolfshunter-collective-test.limoorange99.workers.dev"
        run: npm run test:browser
